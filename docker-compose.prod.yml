services:
  db:
    image: postgres:16-alpine
    container_name: constructpro_prod_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-constructpro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-constructpro_dev}
      POSTGRES_DB: ${POSTGRES_DB:-constructpro}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-constructpro} -d ${POSTGRES_DB:-constructpro}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - constructpro_prod_net

  backend:
    image: constructpro-backend:prod
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: constructpro_prod_backend
    restart: always
    environment:
      - PORT=8001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-constructpro}:${POSTGRES_PASSWORD:-constructpro_dev}@db:5432/${POSTGRES_DB:-constructpro}
      - CORS_ORIGINS=["http://localhost","http://localhost:${FRONTEND_PORT:-8080}","http://127.0.0.1","http://127.0.0.1:${FRONTEND_PORT:-8080}"]
    ports:
      # Expose backend on configurable port (default 8005 to prevent conflict with 8000/8001)
      - "${BACKEND_PORT:-8005}:8001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - constructpro_prod_net

  frontend:
    image: constructpro-frontend:prod
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: constructpro_prod_frontend
    restart: always
    ports:
      # Expose frontend on configurable port (default 8080 to prevent conflict with port 80/3000)
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - constructpro_prod_net

volumes:
  postgres_prod_data:

networks:
  constructpro_prod_net:
    name: constructpro_prod_net
