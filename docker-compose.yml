services:
  db:
    image: postgres:16-alpine
    container_name: constructpro_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: constructpro
      POSTGRES_PASSWORD: constructpro_dev
      POSTGRES_DB: constructpro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U constructpro -d constructpro"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
